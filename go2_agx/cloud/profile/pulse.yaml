# Pulse ROS 2 runtime profile for the Odin1 cloud stream, comms only: NO control adapter, NO teleop, NO motion.
# Built from the Go2 profile (robots/unitree-go2-000/pulse.yaml in ardia-robotics) with the control, localization and
# camera parts removed. Identity is shared with the Go2 runtime for now: never run both at the same time
# (start_cloud.sh refuses when broker_type is aws_iot and the Go2 runtime is up).
#
# Mounted at /etc/ardia in the container odin-pulse-cloud (image ardia/pulse-runtime).
# DDS: the ROS 1 -> ROS 2 bridge (odin-bridge) is FastRTPS on domain 42 with a UDP-only config, so this runtime uses the same.
#
# Phase 1: broker_type mock (no AWS). Phase 3: broker_type aws_iot with the certificates mounted from ARDIA_IOT_DIR.
# Phase 2: media_gateway with the stream odin_camera (Odin1 camera over KVS WebRTC). The stream stays enabled: false until real
# AWS access exists: media_gateway starts KVS signaling BEFORE the GStreamer pipeline, so an enabled stream cannot run without it.

pulse_bringup:
  ros__parameters:
    runtime.pulse.actions:
      - cloud_gateway
      - media_gateway
      - robot_status_collector
      - communications_lifecycle_manager
      - observability_lifecycle_manager

    runtime.pulse.env:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/etc/ardia/dds/fastdds_udp.xml
      - FASTDDS_DEFAULT_PROFILES_FILE=/etc/ardia/dds/fastdds_udp.xml

    launch.cloud_gateway.kind: lifecycle_node
    launch.cloud_gateway.package: cloud_gateway
    launch.cloud_gateway.executable: cloud_gateway
    launch.cloud_gateway.name: cloud_gateway
    launch.cloud_gateway.respawn: true
    launch.cloud_gateway.respawn_delay: 2.0

    launch.media_gateway.kind: lifecycle_node
    launch.media_gateway.package: media_gateway
    launch.media_gateway.executable: media_gateway
    launch.media_gateway.name: media_gateway
    launch.media_gateway.respawn: true
    launch.media_gateway.respawn_delay: 2.0

    launch.robot_status_collector.kind: lifecycle_node
    launch.robot_status_collector.package: robot_status_collector
    launch.robot_status_collector.executable: robot_status_collector
    launch.robot_status_collector.name: robot_status_collector
    launch.robot_status_collector.respawn: true
    launch.robot_status_collector.respawn_delay: 2.0

    launch.communications_lifecycle_manager.kind: node
    launch.communications_lifecycle_manager.package: ardia_lifecycle_manager
    launch.communications_lifecycle_manager.executable: ardia_lifecycle_manager
    launch.communications_lifecycle_manager.name: communications_lifecycle_manager
    launch.communications_lifecycle_manager.respawn: true
    launch.communications_lifecycle_manager.respawn_delay: 1.0

    launch.observability_lifecycle_manager.kind: node
    launch.observability_lifecycle_manager.package: ardia_lifecycle_manager
    launch.observability_lifecycle_manager.executable: ardia_lifecycle_manager
    launch.observability_lifecycle_manager.name: observability_lifecycle_manager
    launch.observability_lifecycle_manager.respawn: true
    launch.observability_lifecycle_manager.respawn_delay: 1.0

communications_lifecycle_manager:
  ros__parameters:
    node_names:
      - cloud_gateway
      - media_gateway
    autostart: true
    transition_attempts: 3
    service_timeout_ms: 2000
    diagnostics_period_s: 1.0
    enable_bond: true
    bond_heartbeat_period_s: 0.1
    bond_heartbeat_timeout_s: 3.0

observability_lifecycle_manager:
  ros__parameters:
    node_names: [robot_status_collector]
    autostart: true
    transition_attempts: 3
    service_timeout_ms: 2000
    diagnostics_period_s: 1.0
    enable_bond: true
    bond_heartbeat_period_s: 0.1
    bond_heartbeat_timeout_s: 1.0

robot_status_collector:
  ros__parameters:
    robot_type: go2
    status: online
    cloud_gateway.robot_status_snapshot_topic: /cloud_gateway/robot_status/snapshot
    cloud_gateway.robot_status_timeseries_topic: /cloud_gateway/robot_status/timeseries
    publish_period_s: 30.0
    timeseries_period_s: 10.0
    diagnostics_period_s: 1.0
    disk_paths: ["/"]
    hosts.ids: [jetson]
    hosts.local_id: jetson
    hosts.jetson.role: edge_gpu
    collectors.host_metrics.enabled: true
    collectors.diagnostics.enabled: true
    collectors.topic_liveness.enabled: true
    collectors.gateway_diagnostics.enabled: true
    collectors.lifecycle.enabled: true
    # The Go2's /lowstate is on the Go2's own DDS domain (0), not on the bridge domain: no battery here.
    collectors.battery.enabled: false
    enable_bond: true
    bond_topic_name: /observability_lifecycle_manager/bond
    bond_id: robot_status_collector
    bond_heartbeat_period_s: 0.1
    bond_heartbeat_timeout_s: 1.0

cloud_gateway:
  ros__parameters:
    env: dev
    fleet: madeira-lab
    robot_id: unitree-go2-000
    thing_name: pulse-dev-unitree-go2-000

    broker_type: mock
    endpoint: ""
    client_id: pulse-dev-unitree-go2-000
    certificate_path: /etc/ardia/iot/certs/robot.crt
    private_key_path: /etc/ardia/iot/private/robot.key
    ca_path: /etc/ardia/iot/ca/amazon-root-ca.pem
    keepalive_s: 30
    connect_timeout_s: 10
    operation_timeout_s: 5
    reconnect_min_s: 5
    reconnect_max_s: 30

    heartbeat_period_s: 5.0
    diagnostics_period_s: 1.0
    outbound_queue_max_messages: 100
    command_dedupe_cache_size: 128
    # Nothing from the cloud may act on the robot: no command dispatch.
    enable_command_dispatch: false
    dispatch_service_timeout_ms: 1000

    enable_bond: true
    bond_topic_name: /communications_lifecycle_manager/bond
    bond_id: cloud_gateway
    bond_heartbeat_period_s: 0.1
    bond_heartbeat_timeout_s: 1.0

media_gateway:
  ros__parameters:
    stream_names:
      - odin_camera
    process_shutdown_timeout_s: 5.0
    diagnostics_period_s: 1.0
    monitor_period_s: 1.0

    enable_bond: true
    bond_topic_name: /communications_lifecycle_manager/bond
    bond_id: media_gateway
    bond_heartbeat_period_s: 0.1
    bond_heartbeat_timeout_s: 3.0

    # Odin1 camera: JPEG 1600x1296 at about 10 Hz on /odin1/image/compressed (ROS 1), carried to ROS 2 by odin-bridge.
    # Pipeline (from media_gateway.cpp): jpegdec ! nvvidconv ! scale ! overlay ! nvv4l2h264enc ! appsink.
    streams.odin_camera.enabled: false
    streams.odin_camera.channel_name: pulse-dev-unitree-go2-000.odin_camera
    streams.odin_camera.client_id: ProducerMaster
    streams.odin_camera.max_concurrent_viewers: 10
    streams.odin_camera.media_type: video-only
    streams.odin_camera.source_type: ros_compressed_image
    streams.odin_camera.video_device: ""
    streams.odin_camera.rtsp_uri: ""
    streams.odin_camera.ros_topic: ""
    streams.odin_camera.ros_compressed_topic: /odin1/image/compressed
    streams.odin_camera.ros_compressed_format: jpeg
    streams.odin_camera.ros_image_encoding: ""
    streams.odin_camera.source_stale_after_ms: 10000
    streams.odin_camera.restart_on_stale: true
    streams.odin_camera.custom_pipeline: ""
    streams.odin_camera.csi_sensor_id: 0
    streams.odin_camera.video_width: 1280
    streams.odin_camera.video_height: 1040
    streams.odin_camera.video_framerate: 10
    streams.odin_camera.bitrate_kbps: 2000
    streams.odin_camera.encoder: nvv4l2h264
    streams.odin_camera.overlay_clock: true
    streams.odin_camera.overlay_label: go2-000.odin
    streams.odin_camera.appsink_max_buffers: 1
    streams.odin_camera.rtsp_latency_ms: 100
    streams.odin_camera.audio_enabled: false
    streams.odin_camera.audio_device: ""
    streams.odin_camera.audio_codec: opus
    streams.odin_camera.ice_transport_policy: relay
    streams.odin_camera.aws_region: eu-west-1
    streams.odin_camera.iot_credential_endpoint: c2st2rq0nl9nl1.credentials.iot.eu-west-1.amazonaws.com
    streams.odin_camera.iot_role_alias: PulseKvsWebrtcRoleAlias
    streams.odin_camera.iot_thing_name: pulse-dev-unitree-go2-000
    streams.odin_camera.iot_certificate_path: /etc/ardia/iot/certs/robot.crt
    streams.odin_camera.iot_private_key_path: /etc/ardia/iot/private/robot.key
    streams.odin_camera.iot_ca_path: /etc/ardia/iot/ca/amazon-root-ca.pem
    streams.odin_camera.iot_certificate_id: ""
    streams.odin_camera.restart_on_error: true
    streams.odin_camera.restart_delay_s: 2.0
