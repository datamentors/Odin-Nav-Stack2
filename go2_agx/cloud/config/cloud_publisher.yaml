# cloud_publisher settings. Rates are per message kind (Hz); 0 turns a kind off.
identity:                     # goes into the envelope of every message (same as the Pulse profile)
  robot_id: unitree-go2-000
  env: dev
  fleet: madeira-lab
  source: odin_cloud_publisher
  schema_version: "1.0.0"
map_name: ""                  # empty = read it from the ONS2 parameter below
map_name_param: /map_planner/map_file_name   # where ONS2 keeps the map name
base_frame: odin1_base_link
map_frame: map
camera_frame: camera_link     # same as yolo_detector.py; YOLO 3D points are treated as being in this frame
tf_max_age_s: 1.0             # older than this = not relocalized
rates_hz:
  pose: 2.0
  yolo_max: 2.0               # upper limit; sent when the list changes
  yolo_refresh_s: 10.0        # an unchanged list is sent again after this long (late viewers)
  status_refresh_s: 10.0      # the whole odin.status.v1 is sent again after this long
  nav_active_refresh_s: 2.0   # ... or this long while a mission is NAVIGATING (status arrives at 2 Hz)
  min_status_interval_s: 1.0  # never faster: AWS IoT allows about 1 retained publish per second per topic
max_objects: 50
topics:
  odometry: /odin1/odometry
  map: /map
  nav_status: /waypoint_manager/status
  yolo_3d: /yolo_detections_3d
  yolo_names: /yolo_class_names
  florence: /florence/objects_3d
out:                          # the String inputs of the Pulse cloud_gateway (node name cloud_gateway, "~/telemetry" ...)
  telemetry: /cloud_gateway/telemetry   # odin.pose.v1, odin.detections.yolo.v1  (QoS 0)
  status: /cloud_gateway/status         # odin.status.v1                          (QoS 1, retained)
  events: /cloud_gateway/events         # odin.detections.florence.v1             (QoS 1)
